<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>パクチー 管理画面（倉庫）</title>
<link rel="icon" type="image/png" href="logokome.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#2F7A3E; --green-dark:#24592F; --green-light:#C7E5A2;
  --red:#B3261E; --red-light:#FBEAE9; --orange:#e65100; --orange-light:#fff3e0;
  --blue:#1565c0; --blue-light:#e3f2fd; --gray:#8A9186; --gray-light:#F3EDE0;
  --gray1:#2E3327; --gray2:#5F6557; --gray3:#868C7D; --gray4:#DCD6C7; --white:#FFFDF8;
  --paper:#FBF7EE; --hairline:rgba(46,51,39,.1);
  --radius:20px; --shadow:0 3px 12px rgba(46,51,39,.06);
  --heading:'Zen Maru Gothic',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Noto Sans JP",system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Meiryo",sans-serif;background:var(--paper);color:var(--gray1);font-size:14px;}

/* ===== TOPBAR ===== */
#topbar{background:var(--green-dark);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
#topbar .brand{display:flex;align-items:center;gap:10px;}
#topbar .brand img{width:32px;height:32px;border-radius:8px;flex-shrink:0;}
#topbar h1{font-family:var(--heading);font-size:16px;font-weight:700;letter-spacing:.02em;white-space:nowrap;}
#topbar .spacer{flex:1;}
#staff-input{padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;font-size:12px;width:130px;}
#staff-input::placeholder{color:rgba(255,255,255,.65);}
#staff-input:focus{outline:none;border-color:rgba(255,255,255,.7);background:rgba(255,255,255,.18);}
.tb-btn{padding:9px 18px;border:none;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;transition:background .15s ease;}
.tb-btn:hover{background:rgba(255,255,255,.26);}
.tb-btn.primary{background:var(--leaf,#8FBF52);color:#17331C;}
.tb-btn.primary:hover{background:#A0CF63;}
#conn-status{font-size:11px;opacity:.85;white-space:nowrap;}
.lang-btn{padding:6px 13px;border-radius:999px;border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s ease;}
.lang-btn.active{background:#fff;color:var(--green-dark);border-color:#fff;}

/* ===== TAB BAR (dạng viên thuốc, giống trang chính) ===== */
#maintabs{display:flex;gap:8px;padding:14px 24px;background:var(--white);border-bottom:1px solid var(--hairline);flex-wrap:wrap;}
.main-tab-btn{padding:11px 20px;border:none;background:var(--paper);font-size:13px;font-weight:700;color:var(--gray2);cursor:pointer;border-radius:999px;transition:all .15s ease;}
.main-tab-btn:hover{background:var(--gray-light);}
.main-tab-btn.active{color:#fff;background:var(--green);}
.main-tab-btn.active:hover{background:var(--green-dark);}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* ===== TOOLBAR ===== */
#toolbar{display:flex;gap:10px;padding:18px 24px;background:var(--white);border-bottom:1px solid var(--hairline);flex-wrap:wrap;align-items:center;}
#search-input{flex:1;min-width:220px;padding:11px 18px;border:1px solid var(--gray4);border-radius:999px;font-size:13px;background:var(--paper);}
#search-input:focus{outline:none;border-color:var(--green);background:var(--white);}
.status-filter{display:flex;gap:6px;flex-wrap:wrap;}
.sf-btn{padding:8px 16px;border-radius:999px;border:1px solid var(--gray4);background:var(--white);font-size:12px;font-weight:600;cursor:pointer;color:var(--gray2);transition:all .15s ease;}
.sf-btn:hover{background:var(--gray-light);}
.sf-btn.active{background:var(--green);border-color:var(--green);color:#fff;font-weight:700;}
#count-chip{font-size:12px;color:var(--gray3);white-space:nowrap;}

#content, #products-content, #announcements-content{padding:24px;max-width:1400px;margin:0 auto;}
#empty-msg{text-align:center;color:var(--gray3);padding:80px 20px;font-size:14px;line-height:1.8;}
#empty-msg.hidden{display:none;}

/* ===== THẺ ĐƠN HÀNG ===== */
.order-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;}
.order-card{background:var(--white);border:1px solid var(--hairline);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;border-top:3px solid var(--gray4);transition:box-shadow .15s ease,transform .15s ease;}
.order-card:hover{box-shadow:0 8px 22px rgba(46,51,39,.1);transform:translateY(-1px);}
.order-card.st-未処理{border-top-color:var(--red);}
.order-card.st-処理中{border-top-color:var(--blue);}
.order-card.st-完了{border-top-color:var(--green);}
.order-card.st-キャンセル{border-top-color:var(--gray);opacity:.65;}
.oc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:8px;}
.oc-name{font-family:var(--heading);font-size:15.5px;font-weight:700;}
.oc-time{font-size:11px;color:var(--gray3);margin-top:3px;}
.oc-source{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--gray-light);color:var(--gray2);margin-left:6px;}
.status-badge{font-size:11px;font-weight:700;padding:5px 12px;border-radius:999px;white-space:nowrap;border:none;cursor:pointer;transition:filter .15s ease;}
.status-badge:hover{filter:brightness(0.95);}
.status-badge.st-未処理{background:var(--red-light);color:var(--red);}
.status-badge.st-処理中{background:var(--blue-light);color:var(--blue);}
.status-badge.st-完了{background:var(--green-light);color:var(--green-dark);}
.status-badge.st-キャンセル{background:var(--gray-light);color:var(--gray);}
.oc-row{font-size:12.5px;color:var(--gray2);margin-bottom:6px;display:flex;gap:7px;}
.oc-row b{color:var(--gray1);font-weight:700;flex-shrink:0;}
.oc-items{white-space:pre-wrap;background:var(--gray-light);border-radius:12px;padding:10px 12px;font-size:12.5px;margin-top:10px;line-height:1.6;}
.oc-note{white-space:pre-wrap;background:#FFF6E0;border-radius:12px;padding:10px 12px;font-size:12px;margin-top:8px;color:#7a6023;line-height:1.6;}
.oc-actions{display:flex;gap:8px;margin-top:12px;}
.oc-actions button{flex:1;padding:10px;border-radius:999px;border:1px solid var(--gray4);background:var(--white);font-size:12px;font-weight:700;cursor:pointer;color:var(--gray2);transition:all .15s ease;}
.oc-actions button:hover{background:var(--green);border-color:var(--green);color:#fff;}

/* ===== MODAL ===== */
#modal-overlay{position:fixed;inset:0;background:rgba(20,30,20,.5);display:none;align-items:center;justify-content:center;z-index:500;padding:20px;}
#modal-overlay.show{display:flex;}
#modal-box{background:var(--white);border-radius:24px;max-width:480px;width:100%;max-height:88vh;overflow-y:auto;padding:28px;}
#modal-box h2{font-family:var(--heading);font-size:18px;font-weight:700;letter-spacing:.02em;color:var(--green-dark);margin-bottom:18px;}
.m-field{margin-bottom:14px;}
.m-field label{display:block;font-size:12px;font-weight:700;color:var(--gray2);margin-bottom:5px;}
.m-field input,.m-field textarea,.m-field select{width:100%;padding:10px 14px;border:1px solid var(--gray4);border-radius:14px;font-size:13.5px;font-family:inherit;background:var(--paper);}
.m-field input:focus,.m-field textarea:focus,.m-field select:focus{outline:none;border-color:var(--green);background:var(--white);}
.m-field textarea{min-height:60px;resize:vertical;}
.m-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.m-actions{display:flex;gap:10px;margin-top:18px;}
.m-actions button{flex:1;padding:13px;border-radius:999px;border:none;font-weight:700;font-size:13px;cursor:pointer;transition:background .15s ease;}
.m-actions .save{background:var(--green);color:#fff;}
.m-actions .save:hover{background:var(--green-dark);}
.m-actions .cancel{background:var(--gray-light);color:var(--gray2);}
.m-actions .cancel:hover{background:var(--gray4);}

/* ===== SẢN PHẨM / THÔNG BÁO ===== */
.top-action-row{display:flex;justify-content:flex-end;margin-bottom:18px;}
.btn-add{padding:12px 22px;border:none;border-radius:999px;background:var(--green);color:#fff;font-weight:700;font-size:13px;cursor:pointer;transition:background .15s ease;}
.btn-add:hover{background:var(--green-dark);}

.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}
.prod-card{background:var(--white);border:1px solid var(--hairline);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:9px;transition:box-shadow .15s ease;}
.prod-card:hover{box-shadow:0 8px 22px rgba(46,51,39,.1);}
.prod-img-row{display:flex;gap:8px;}
.prod-img-box{width:100%;aspect-ratio:1/1;border-radius:14px;background:var(--gray-light);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;position:relative;}
.prod-img-row .prod-img-box{width:auto;flex:1;min-width:0;}
.prod-img-box img{width:100%;height:100%;object-fit:cover;}
.prod-img-box .ph{font-size:34px;}
.prod-img-box .upload-hint{position:absolute;bottom:0;left:0;right:0;background:rgba(20,30,20,.6);color:#fff;font-size:10px;text-align:center;padding:5px;}
.prod-img-box .slot-tag{position:absolute;top:5px;left:6px;background:rgba(20,30,20,.55);color:#fff;font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:999px;}
.prod-card input,.prod-card textarea,.prod-card select{width:100%;padding:8px 12px;border:1px solid var(--gray4);border-radius:12px;font-size:12.5px;font-family:inherit;background:var(--paper);}
.prod-card input:focus,.prod-card textarea:focus,.prod-card select:focus{outline:none;border-color:var(--green);background:var(--white);}
.prod-card textarea{min-height:44px;resize:vertical;}
.prod-card .f-name{font-family:var(--heading);font-weight:700;font-size:13.5px;}
.prod-field-label{font-size:10.5px;font-weight:700;color:var(--gray3);letter-spacing:.02em;}
.prod-row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.prod-actions{display:flex;gap:8px;margin-top:6px;}
.prod-actions button{flex:1;padding:9px;border-radius:999px;border:none;font-weight:700;font-size:12px;cursor:pointer;transition:background .15s ease;}
.prod-actions .save{background:var(--green);color:#fff;}
.prod-actions .save:hover{background:var(--green-dark);}
.prod-actions .delete{background:var(--red-light);color:var(--red);}
.prod-actions .delete:hover{background:var(--red);color:#fff;}

.ann-list{display:flex;flex-direction:column;gap:14px;}
.ann-card{background:var(--white);border:1px solid var(--hairline);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;}
.ann-card input,.ann-card textarea{width:100%;padding:9px 13px;border:1px solid var(--gray4);border-radius:12px;font-size:13px;font-family:inherit;margin-top:5px;background:var(--paper);}
.ann-card input:focus,.ann-card textarea:focus{outline:none;border-color:var(--green);background:var(--white);}
.ann-card .f-title{font-family:var(--heading);font-weight:700;font-size:14.5px;}
.ann-card textarea{min-height:60px;resize:vertical;}
.ann-field-label{font-size:11px;font-weight:700;color:var(--gray3);margin-top:10px;display:block;letter-spacing:.02em;}
.ann-row-top{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.ann-visible-toggle{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--gray2);}
.ann-actions{display:flex;gap:8px;margin-top:12px;align-items:center;}
.ann-actions button{padding:9px 18px;border-radius:999px;border:none;font-weight:700;font-size:12px;cursor:pointer;transition:background .15s ease;}
.ann-actions .save{background:var(--green);color:#fff;}
.ann-actions .save:hover{background:var(--green-dark);}
.ann-actions .delete{background:var(--red-light);color:var(--red);}
.ann-actions .delete:hover{background:var(--red);color:#fff;}

/* ===== TAB: TRANG CHỦ ===== */
#hero-settings-content{max-width:800px;margin:0 auto;padding:28px 24px 70px;}
.hero-section-title{font-family:var(--heading);font-size:16px;font-weight:700;color:var(--green-dark);margin-bottom:6px;}
.hero-section-hint{font-size:12px;color:var(--gray3);margin-bottom:16px;line-height:1.7;}
.hero-slide-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
.hero-slide-thumb{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:var(--gray-light);}
.hero-slide-thumb img{width:100%;height:100%;object-fit:cover;}
.hero-slide-thumb .del-btn{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;border:none;background:rgba(20,30,20,.65);color:#fff;font-size:12px;cursor:pointer;line-height:1;}
.hero-slide-add{aspect-ratio:16/9;border:2px dashed var(--gray4);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--gray3);cursor:pointer;background:var(--white);transition:all .15s ease;}
.hero-slide-add:hover{border-color:var(--green);color:var(--green);background:var(--gray-light);}
</style>
</head>
<body>

<div id="topbar">
  <div class="brand">
    <img src="logokome.png" alt="KOME">
    <h1 data-i18n="pageTitle">🌿 パクチー 管理画面（倉庫）</h1>
  </div>
  <div class="spacer"></div>
  <button class="lang-btn" id="lang-btn-vi" onclick="setLang('vi')">VI</button>
  <button class="lang-btn" id="lang-btn-ja" onclick="setLang('ja')">JA</button>
  <span id="conn-status"></span>
  <input id="staff-input" data-i18n-placeholder="staffPh" placeholder="担当者名">
</div>

<div id="maintabs">
  <button class="main-tab-btn active" data-tab="orders" onclick="switchTab('orders')" data-i18n="tabOrders">📦 注文管理</button>
  <button class="main-tab-btn" data-tab="products" onclick="switchTab('products')" data-i18n="tabProducts">🌿 商品管理</button>
  <button class="main-tab-btn" data-tab="announcements" onclick="switchTab('announcements')" data-i18n="tabAnnouncements">📢 お知らせ管理</button>
  <button class="main-tab-btn" data-tab="hero" onclick="switchTab('hero')" data-i18n="tabHero">🖼 トップページ</button>
</div>

<!-- ===== TAB: ĐƠN HÀNG ===== -->
<div class="tab-panel active" id="tab-orders">
  <div id="toolbar">
    <input id="search-input" data-i18n-placeholder="searchPh" placeholder="🔍 会社名・電話番号・住所で検索" oninput="renderOrders()">
    <div class="status-filter" id="status-filter">
      <button class="sf-btn active" data-st="all" onclick="setFilter('all')" data-i18n="filterAll">すべて</button>
      <button class="sf-btn" data-st="未処理" onclick="setFilter('未処理')" data-i18n="filterUnprocessed">未処理</button>
      <button class="sf-btn" data-st="処理中" onclick="setFilter('処理中')" data-i18n="filterProcessing">処理中</button>
      <button class="sf-btn" data-st="完了" onclick="setFilter('完了')" data-i18n="filterDone">完了</button>
      <button class="sf-btn" data-st="キャンセル" onclick="setFilter('キャンセル')" data-i18n="filterCancelled">キャンセル</button>
    </div>
    <span id="count-chip"></span>
    <button class="tb-btn primary" style="background:var(--green);color:#fff;" onclick="checkMailNow(this)" data-i18n="btnCheckMail">📬 メールを今すぐ確認</button>
    <button class="tb-btn primary" style="background:var(--green);color:#fff;" onclick="loadOrders(this)" data-i18n="btnRefresh">🔄 更新</button>
  </div>
  <div id="content">
    <div id="empty-msg" data-i18n="emptyLoading">読み込み中...</div>
    <div class="order-grid" id="order-grid"></div>
  </div>
</div>

<!-- ===== TAB: SẢN PHẨM ===== -->
<div class="tab-panel" id="tab-products">
  <div id="products-content">
    <div class="top-action-row"><button class="btn-add" onclick="addProductCard(this)" data-i18n="btnAddProduct">+ 商品を追加</button></div>
    <div class="prod-grid" id="prod-grid"></div>
    <input type="file" id="prod-file-input" accept="image/*" style="display:none;" onchange="onProductImageChosen(event)">
  </div>
</div>

<!-- ===== TAB: THÔNG BÁO ===== -->
<div class="tab-panel" id="tab-announcements">
  <div id="announcements-content">
    <div class="top-action-row"><button class="btn-add" onclick="addAnnouncementCard(this)" data-i18n="btnAddAnnouncement">+ お知らせを追加</button></div>
    <div class="ann-list" id="ann-list"></div>
  </div>
</div>

<!-- ===== TAB: TRANG CHỦ (hero shop.html) ===== -->
<div class="tab-panel" id="tab-hero">
  <div id="hero-settings-content">
    <h3 class="hero-section-title" data-i18n="heroImagesTitle">スライド画像（複数可）</h3>
    <p class="hero-section-hint" data-i18n="heroImagesHint">複数の画像を追加すると、ショップのトップに自動で切り替わるスライドショーとして表示されます。</p>
    <div class="hero-slide-grid" id="hero-slide-grid"></div>
    <input type="file" id="hero-file-input" accept="image/*" style="display:none;" onchange="onHeroImageChosen(event)">

    <h3 class="hero-section-title" style="margin-top:26px;" data-i18n="heroTextTitle">見出し・説明文</h3>
    <div class="m-row2">
      <div class="m-field"><label data-i18n="heroLabelEyebrowVi">小見出し（VI）</label><input id="hs-eyebrowVi"></div>
      <div class="m-field"><label data-i18n="heroLabelEyebrowJa">小見出し（JA）</label><input id="hs-eyebrowJa"></div>
    </div>
    <div class="m-row2">
      <div class="m-field"><label data-i18n="heroLabelTitleVi">タイトル（VI）</label><textarea id="hs-titleVi"></textarea></div>
      <div class="m-field"><label data-i18n="heroLabelTitleJa">タイトル（JA）</label><textarea id="hs-titleJa"></textarea></div>
    </div>
    <div class="m-row2">
      <div class="m-field"><label data-i18n="heroLabelSubVi">説明文（VI）</label><textarea id="hs-subVi"></textarea></div>
      <div class="m-field"><label data-i18n="heroLabelSubJa">説明文（JA）</label><textarea id="hs-subJa"></textarea></div>
    </div>
    <div class="m-row2">
      <div class="m-field"><label data-i18n="heroLabelCtaVi">CTA文言（VI）</label><input id="hs-ctaTextVi"></div>
      <div class="m-field"><label data-i18n="heroLabelCtaJa">CTA文言（JA）</label><input id="hs-ctaTextJa"></div>
    </div>
    <div class="top-action-row"><button class="btn-add" onclick="saveHeroSettings(this)" data-i18n="btnSaveHero">💾 保存</button></div>
  </div>
</div>

<div id="modal-overlay" onclick="if(event.target===this) closeModal()">
  <div id="modal-box">
    <h2 data-i18n="modalTitle">注文内容を編集</h2>
    <div class="m-field">
      <label data-i18n="labelName">会社名・お名前</label>
      <input id="m-customerName">
    </div>
    <div class="m-row2">
      <div class="m-field"><label data-i18n="labelPostal">郵便番号</label><input id="m-postalCode"></div>
      <div class="m-field"><label data-i18n="labelPhone">電話番号</label><input id="m-phone"></div>
    </div>
    <div class="m-field"><label data-i18n="labelAddress">ご住所</label><input id="m-address"></div>
    <div class="m-field"><label data-i18n="labelAddress2">番地・建物名</label><input id="m-addressDetail"></div>
    <div class="m-field"><label data-i18n="labelEmail">メールアドレス</label><input id="m-customerEmail"></div>
    <div class="m-field"><label data-i18n="labelDate">ご希望お届け日時</label><input id="m-desiredDate"></div>
    <div class="m-field"><label data-i18n="labelItems">ご注文内容・数量</label><textarea id="m-items"></textarea></div>
    <div class="m-field"><label data-i18n="labelNote">備考</label><textarea id="m-note"></textarea></div>
    <div class="m-field">
      <label data-i18n="labelStatus">ステータス</label>
      <select id="m-status">
        <option value="未処理" data-i18n="filterUnprocessed">未処理</option>
        <option value="処理中" data-i18n="filterProcessing">処理中</option>
        <option value="完了" data-i18n="filterDone">完了</option>
        <option value="キャンセル" data-i18n="filterCancelled">キャンセル</option>
      </select>
    </div>
    <div class="m-actions">
      <button class="cancel" onclick="closeModal()" data-i18n="btnCancel">キャンセル</button>
      <button class="save" onclick="saveModal(this)" data-i18n="btnSave">保存</button>
    </div>
  </div>
</div>

<script>
// Cung 1 Apps Script deployment voi index.html/shop.html - dung cac action
// getMailOrders/updateMailOrder/checkMailOrdersNow + getAdminProducts/addProduct/

  '未処理':  {vi:'Chưa xử lý', ja:'未処理'},

};
function trStatus(st){
  const e = STATUS_I18N[st];
  return e ? (e[currentLang] || e.vi) : (st || '');
}
function trSource(src){
  if (src === 'ネット注文') return tr('sourceWeb');
  if (src === '見積依頼') return tr('sourceQuote');
  return tr('sourceMail');
}
function tr(key){
  const e = I18N[key];
  if (!e) return key;
  return e[currentLang] || e.vi || key;
}
function tf(key, vars){
  let s = tr(key);
  Object.keys(vars || {}).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); });
  return s;
}
function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = tr(el.getAttribute('data-i18n')); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = tr(el.getAttribute('data-i18n-placeholder')); });
  document.getElementById('lang-btn-vi').classList.toggle('active', currentLang === 'vi');
  document.getElementById('lang-btn-ja').classList.toggle('active', currentLang === 'ja');
  document.documentElement.lang = currentLang;
}

var jsonpSeq = 0;
function fetchJSONP(url){
  return new Promise((res, rej) => {
    const cb = 'wh_cb_' + (++jsonpSeq) + '_' + Date.now();
    const s = document.createElement('script');
    // 10s (khong phai 20s) - server tra loi cham hon muc nay la bat thuong, bao loi
    // som cho nguoi dung con hon de trang "treo" im lim khong ro dang tai hay da hong.
    const t = setTimeout(() => { cl(); rej(new Error('Timeout (10s)')); }, 10000);
    // Neu Apps Script tra ve trang loi (vd CHUA cap quyen Drive/Gmail sau khi them
    // tinh nang moi) thay vi goi dung callback(...), trinh duyet nem ReferenceError
    // "cb is not defined" o SCOPE TOAN CUC - khong lot qua duoc try/catch cua Promise
    // nay, nen phai bat bang window.onerror thi moi bao loi NGAY duoc thay vi treo
    // den het 10s timeout moi biet.
    function onGlobalError(ev){
      const msg = (ev && ev.message) || '';
      const src = (ev && ev.filename) || '';
      if (msg.indexOf(cb) !== -1 || src.indexOf(sheetUrl.split('?')[0]) !== -1) {
        cl(); rej(new Error('Server response error'));
      }
    }
    window.addEventListener('error', onGlobalError);
    window[cb] = d => { cl(); res(d); };
    function cl(){ clearTimeout(t); delete window[cb]; window.removeEventListener('error', onGlobalError); s.parentNode && s.parentNode.removeChild(s); }
    s.onerror = () => { cl(); rej(new Error('connection error')); };
    s.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cb;
    document.head.appendChild(s);
  });
}
function apiGet(actionQuery){
  const sep = sheetUrl.includes('?') ? '&' : '?';
  return fetchJSONP(sheetUrl + sep + actionQuery);
}
function apiPost(body){
  return fetch(sheetUrl, { method: 'POST', body: JSON.stringify(body) }).then(r => r.json());
}
function setStatus(text, ok){
  const el = document.getElementById('conn-status');
  el.textContent = text;
  el.style.color = ok === false ? '#ffcdd2' : (ok === true ? '#b9f6ca' : '#fff');
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Kiem tra file co phai anh khong. KHONG chi dua vao file.type: mot so may Windows
// tra ve file.type rong/sai cho file .jpg (loi lien ket dinh dang cua he dieu hanh,
// khong phai loi web) - nen fallback kiem tra theo duoi file khi type khong ro.
function looksLikeImageFile(file){
  if (file.type && file.type.startsWith('image/')) return true;
  return /\.(jpe?g|png|gif|webp|bmp|heic|heif)$/i.test(file.name || '');
}

// Thu nho + nen anh NGAY TREN TRINH DUYET truoc khi gui len server (qua canvas) - anh
// dien thoai goc thuong 3-10MB, sau buoc nay con ~150-400KB nen upload nhanh hon RAT
// NHIEU va khong ton quota Drive. 1600px la du net cho card san pham/hero (Drive con
// tu resize xuong 1000px khi hien thi qua URL thumbnail).
function resizeImageFile(file, maxDim, quality){
  return new Promise(function(resolve, reject){
    const reader = new FileReader();
    reader.onload = function(){
      const img = new Image();
      img.onload = function(){
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w >= h) { h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', quality || 0.82);
        resolve({ base64: dataUrl.split(',')[1], mimeType: 'image/jpeg' });
      };
      img.onerror = function(){ reject(new Error('Image decode error')); };
      img.src = reader.result;
    };
    reader.onerror = function(){ reject(new Error('File read error')); };
    reader.readAsDataURL(file);
  });
}

// Disable + doi chu nut khi dang cho server, tranh bam trung / khong ro co dang chay
// khong. flashButton() hien tam 1 chu xac nhan (vd "✓ Da luu") roi tu tra ve chu cu.
function setBtnLoading(btn, loading){
  if (!btn) return;
  if (loading) { btn.disabled = true; btn.dataset.prevText = btn.textContent; btn.textContent = '…'; }
  else { btn.disabled = false; if (btn.dataset.prevText != null) { btn.textContent = btn.dataset.prevText; delete btn.dataset.prevText; } }
}
function flashButton(btn, text, ms){
  if (!btn) return;
  const orig = btn.textContent;
  btn.textContent = text;
  setTimeout(() => { if (btn.textContent === text) btn.textContent = orig; }, ms || 1100);
}

// ===== TAB ĐƠN HÀNG =====
async function loadOrders(btn){
  setBtnLoading(btn, true);
  setStatus(tr('statusLoading'));
  document.getElementById('empty-msg').textContent = tr('emptyLoading');
  document.getElementById('empty-msg').classList.remove('hidden');
  try {
    const j = await apiGet('action=getMailOrders');
    if (j.status === 'success') {
      orders = j.data || [];
      setStatus(tf('statusOkTpl', { t: new Date().toLocaleTimeString(currentLang === 'ja' ? 'ja-JP' : 'vi-VN') }), true);
      renderOrders();
    } else {
      setStatus(tr('statusErr'), false);
      alert(tf('alertFetchErrTpl', { msg: j.message || '?' }));
    }
  } catch (e) {
    setStatus(tr('statusConnFail'), false);
    alert(tf('alertConnFailTpl', { msg: e.message }));
  }
  setBtnLoading(btn, false);
}

async function checkMailNow(btn){
  setBtnLoading(btn, true);
  setStatus(tr('statusChecking'));
  try {
    const j = await apiPost({ action: 'checkMailOrdersNow' });
    setBtnLoading(btn, false);
    if (j.status === 'success') {
      alert(tf('alertMailCheckedTpl', { n: j.processed || 0 }));
      loadOrders();
    } else {
      alert(tf('alertErrTpl', { msg: j.message || '?' }));
    }
  } catch (e) {
    setBtnLoading(btn, false);
    alert(tf('alertConnFailTpl', { msg: e.message }));
  }
}

function setFilter(st){
  currentFilter = st;
  document.querySelectorAll('.sf-btn').forEach(b => b.classList.toggle('active', b.dataset.st === st));
  renderOrders();
}

function renderOrders(){
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  let list = orders.filter(o => currentFilter === 'all' || o.status === currentFilter);
  if (q) {
    list = list.filter(o =>
      (o.customerName || '').toLowerCase().includes(q) ||
      (o.phone || '').toLowerCase().includes(q) ||
      (o.address || '').toLowerCase().includes(q) ||
      (o.addressDetail || '').toLowerCase().includes(q)
    );
  }
  document.getElementById('count-chip').textContent = list.length + ' / ' + orders.length;

  const grid = document.getElementById('order-grid');
  const emptyMsg = document.getElementById('empty-msg');
  if (!list.length) {
    emptyMsg.textContent = orders.length ? tr('emptyNoMatch') : tr('emptyNone');
    emptyMsg.classList.remove('hidden');
    grid.innerHTML = '';
    return;
  }
  emptyMsg.classList.add('hidden');

  grid.innerHTML = list.map(o => {
    const fullAddr = [o.postalCode ? '〒' + o.postalCode : '', o.address, o.addressDetail].filter(Boolean).join(' ');
    return '<div class="order-card st-' + esc(o.status) + '">' +
      '<div class="oc-top">' +
        '<div><div class="oc-name">' + esc(o.customerName || tr('noNameFallback')) + '</div>' +
        '<div class="oc-time">' + esc(tr('receivedPrefix')) + ' ' + esc(o.receivedAt) + '<span class="oc-source">' + esc(trSource(o.source)) + '</span></div></div>' +
        '<button class="status-badge st-' + esc(o.status) + '" onclick="openModal(\'' + o.id + '\')">' + esc(trStatus(o.status)) + '</button>' +
      '</div>' +
      '<div class="oc-row"><b>📍</b><span>' + esc(fullAddr || '-') + '</span></div>' +
      '<div class="oc-row"><b>📞</b><span>' + esc(o.phone || '-') + '</span></div>' +
      '<div class="oc-row"><b>🗓</b><span>' + esc(o.desiredDate || '-') + '</span></div>' +
      (o.items ? '<div class="oc-items">' + esc(o.items) + '</div>' : '') +
      (o.note ? '<div class="oc-note">📝 ' + esc(o.note) + '</div>' : '') +
      '<div class="oc-actions">' +
        '<button onclick="openModal(\'' + o.id + '\')">' + esc(tr('btnEdit')) + '</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

function openModal(id){
  const o = orders.find(x => x.id === id);
  if (!o) return;
  editingId = id;
  ['customerName','postalCode','address','addressDetail','customerEmail','desiredDate','items','note'].forEach(k => {
    document.getElementById('m-' + k).value = o[k] || '';
  });
  document.getElementById('m-phone').value = o.phone || '';
  document.getElementById('m-status').value = o.status || '未処理';
  document.getElementById('modal-overlay').classList.add('show');
}
function closeModal(){
  editingId = null;
  document.getElementById('modal-overlay').classList.remove('show');
}
async function saveModal(btn){
  if (!editingId) return;
  const fields = {};
  ['customerName','postalCode','address','addressDetail','phone','customerEmail','desiredDate','items','note','status'].forEach(k => {
    fields[k] = document.getElementById('m-' + k).value.trim();
  });
  const staff = document.getElementById('staff-input').value.trim();
  setBtnLoading(btn, true);
  try {
    const j = await apiPost({ action: 'updateMailOrder', data: { id: editingId, fields: fields, staff: staff } });
    if (j.status === 'ok') {
      const o = orders.find(x => x.id === editingId);
      if (o) Object.assign(o, fields);
      renderOrders();
      setBtnLoading(btn, false);
      closeModal();
    } else {
      setBtnLoading(btn, false);
      alert(tf('alertSaveErrTpl', { msg: j.message || '?' }));
    }
  } catch (e) {
    setBtnLoading(btn, false);
    alert(tf('alertConnFailTpl', { msg: e.message }));
  }
}

    if (j.status === 'success') { products = j.data || []; renderProducts(); }
    else alert(tf('alertFetchErrTpl', { msg: j.message || '?' }));
  } catch (e) {
    alert(tf('alertConnFailTpl', { msg: e.message }));
  }
}

  const grid = document.getElementById('prod-grid');
  if (!products.length) { grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--gray3);padding:40px 0;">' + esc(tr('emptyProducts')) + '</div>'; return; }

      '</div>' +
    '</div>' +
    '<div><span class="prod-field-label">' + esc(tr('prodNameLabel')) + '</span><input class="f-name" value="' + esc(p.name) + '"></div>' +
    '<div><span class="prod-field-label">' + esc(tr('prodSpecLabel')) + '</span><input class="f-spec" value="' + esc(p.spec) + '"></div>' +
    '<div><span class="prod-field-label">' + esc(tr('prodDescLabel')) + '</span><textarea class="f-desc">' + esc(p.description) + '</textarea></div>' +
    '<div class="prod-row2">' +
      '<div><span class="prod-field-label">' + esc(tr('prodPriceLabel')) + '</span><input class="f-price" type="number" value="' + esc(p.price) + '"></div>' +
      '<div><span class="prod-field-label">' + esc(tr('prodSortLabel')) + '</span><input class="f-sort" type="number" value="' + esc(p.sortOrder) + '"></div>' +
    '</div>' +
    '<div><span class="prod-field-label">' + esc(tr('prodStatusLabel')) + '</span>' +
    '<select class="f-status">' +
      '<option value="在庫あり"' + (p.status === '在庫あり' ? ' selected' : '') + '>' + esc(tr('prodStatusInStock')) + '</option>' +
      '<option value="在庫切れ"' + (p.status === '在庫切れ' ? ' selected' : '') + '>' + esc(tr('prodStatusOut')) + '</option>' +
      '<option value="販売休止"' + (p.status === '販売休止' ? ' selected' : '') + '>' + esc(tr('prodStatusOff')) + '</option>' +
    '</select></div>' +
    '<div class="prod-actions">' +
      '<button class="save" onclick="saveProduct(\'' + p.id + '\', this)">' + esc(tr('btnSaveProduct')) + '</button>' +
      '<button class="delete" onclick="deleteProduct(\'' + p.id + '\', this)">' + esc(tr('btnDeleteProduct')) + '</button>' +
    '</div>' +
  '</div>';
}
async function addProductCard(btn){
  setBtnLoading(btn, true);
  try {
    const fields = { name: tr('prodNewName'), description: '', spec: '', price: 0, imageUrl: '', imageUrl2: '', status: '在庫あり', sortOrder: products.length + 1 };
    const j = await apiPost({ action: 'addProduct', data: { fields: fields } });
    if (j.status === 'ok') {
      products.push(Object.assign({ id: j.id, updatedAt: '' }, fields));
      renderProducts();
    } else alert(tf('alertSaveErrTpl', { msg: j.message || '?' }));
  } catch (e) { alert(tf('alertConnFailTpl', { msg: e.message })); }
  setBtnLoading(btn, false);
}
async function saveProduct(id, btn){
  const card = document.querySelector('.prod-card[data-id="' + id + '"]');
  if (!card) return;
  const fields = {
    name: card.querySelector('.f-name').value.trim(),
    spec: card.querySelector('.f-spec').value.trim(),
    description: card.querySelector('.f-desc').value.trim(),
    price: card.querySelector('.f-price').value,
    sortOrder: card.querySelector('.f-sort').value,
    status: card.querySelector('.f-status').value
  };
  setBtnLoading(btn, true);
  try {
    const j = await apiPost({ action: 'updateProduct', data: { id: id, fields: fields } });
    setBtnLoading(btn, false);
    if (j.status === 'ok') {
      const p = products.find(x => x.id === id);
      if (p) Object.assign(p, fields, { price: parseFloat(fields.price) || 0, sortOrder: parseFloat(fields.sortOrder) || 0 });
      flashButton(btn, tr('savedFlash'));
    } else alert(tf('alertSaveErrTpl', { msg: j.message || '?' }));
  } catch (e) { setBtnLoading(btn, false); alert(tf('alertConnFailTpl', { msg: e.message })); }
}
async function deleteProduct(id, btn){
  if (!confirm(tr('confirmDeleteProduct'))) return;
  setBtnLoading(btn, true);
  try {
    const j = await apiPost({ action: 'deleteProduct', data: { id: id } });
    if (j.status === 'ok') {
      products = products.filter(p => p.id !== id);
      renderProducts();
    } else { setBtnLoading(btn, false); alert(tf('alertSaveErrTpl', { msg: j.message || '?' })); }
  } catch (e) { setBtnLoading(btn, false); alert(tf('alertConnFailTpl', { msg: e.message })); }
}
function triggerImageUpload(id, slot){
  uploadTargetProductId = id;
  uploadTargetSlot = slot || 1;
  document.getElementById('prod-file-input').click();
}
async function onProductImageChosen(ev){
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if (!file || !uploadTargetProductId) return;
  if (!looksLikeImageFile(file)) { alert(tr('errNotImage')); return; }
  const id = uploadTargetProductId;
  const slot = uploadTargetSlot;
  const fieldName = slot === 2 ? 'imageUrl2' : 'imageUrl';
  const boxes = document.querySelectorAll('.prod-card[data-id="' + id + '"] .prod-img-box');
  const box = boxes[slot - 1];
  if (box) box.innerHTML = '<span class="slot-tag">' + slot + '</span><span class="ph">⏳</span><div class="upload-hint">' + esc(tr('uploading')) + '</div>';
  try {
    const resized = await resizeImageFile(file, 1600, 0.82);
    const up = await apiPost({ action: 'uploadProductImage', data: { filename: 'product.jpg', mimeType: resized.mimeType, base64Data: resized.base64 } });
    if (up.status === 'ok') {
      const fields = {}; fields[fieldName] = up.url;
      await apiPost({ action: 'updateProduct', data: { id: id, fields: fields } });
      const p = products.find(x => x.id === id);
      if (p) p[fieldName] = up.url;
    } else {
      alert(tf('alertSaveErrTpl', { msg: up.message || '?' }));
    }
  } catch (e) {
    alert(tf('alertConnFailTpl', { msg: e.message }));
  }
  renderProducts();
}

// ===== TAB THÔNG BÁO =====
async function loadAnnouncements(){
  try {
    const j = await apiGet('action=getAdminAnnouncements');
    if (j.status === 'success') { announcements = j.data || []; renderAnnouncements(); }
    else alert(tf('alertFetchErrTpl', { msg: j.message || '?' }));
  } catch (e) { alert(tf('alertConnFailTpl', { msg: e.message })); }
}
function renderAnnouncements(){
  const list = document.getElementById('ann-list');
  if (!announcements.length) { list.innerHTML = '<div style="text-align:center;color:var(--gray3);padding:40px 0;">' + esc(tr('emptyAnnouncements')) + '</div>'; return; }
  list.innerHTML = announcements.map(a => announcementCardHtml(a)).join('');
}
function announcementCardHtml(a){
  const checked = a.visible === '公開' ? ' checked' : '';
  return '<div class="ann-card" data-id="' + esc(a.id) + '">' +
    '<span class="ann-field-label">' + esc(tr('annTitleLabel')) + '</span>' +
    '<input class="f-title" value="' + esc(a.title) + '">' +
    '<span class="ann-field-label">' + esc(tr('annContentLabel')) + '</span>' +
    '<textarea class="f-content">' + esc(a.content) + '</textarea>' +
    '<span class="ann-field-label">' + esc(tr('annDateLabel')) + '</span>' +
    '<input class="f-date" value="' + esc(a.postDate) + '" placeholder="2026/09/10">' +
    '<div class="ann-actions">' +
      '<label class="ann-visible-toggle"><input type="checkbox" class="f-visible"' + checked + '> ' + esc(tr('annVisibleLabel')) + '</label>' +
      '<button class="save" onclick="saveAnnouncement(\'' + a.id + '\', this)">' + esc(tr('btnSaveAnnouncement')) + '</button>' +
      '<button class="delete" onclick="deleteAnnouncement(\'' + a.id + '\', this)">' + esc(tr('btnDeleteAnnouncement')) + '</button>' +
    '</div>' +
  '</div>';
}
async function addAnnouncementCard(btn){
  setBtnLoading(btn, true);
  try {
    const fields = { title: tr('annNewTitle'), content: '', postDate: '', visible: '公開' };

      announcements.push(Object.assign({ id: j.id, createdAt: '' }, fields));

  } catch (e) { alert(tf('alertConnFailTpl', { msg: e.message })); }

}
async function saveAnnouncement(id, btn){
  const card = document.querySelector('.ann-card[data-id="' + id + '"]');
  if (!card) return;
  const fields = {
    title: card.querySelector('.f-title').value.trim(),
    content: card.querySelector('.f-content').value.trim(),
    postDate: card.querySelector('.f-date').value.trim(),
    visible: card.querySelector('.f-visible').checked ? '公開' : '非公開'
  };

  try {
    const j = await apiPost({ action: 'updateAnnouncement', data: { id: id, fields: fields } });

      const a = announcements.find(x => x.id === id);
      if (a) Object.assign(a, fields);
      flashButton(btn, tr('savedFlash'));

  } catch (e) { setBtnLoading(btn, false); alert(tf('alertConnFailTpl', { msg: e.message })); }
}
async function deleteAnnouncement(id, btn){
  if (!confirm(tr('confirmDeleteAnnouncement'))) return;
  setBtnLoading(btn, true);
  try {
    const j = await apiPost({ action: 'deleteAnnouncement', data: { id: id } });
    if (j.status === 'ok') {
      announcements = announcements.filter(a => a.id !== id);
      renderAnnouncements();
    } else { setBtnLoading(btn, false); alert(tf('alertSaveErrTpl', { msg: j.message || '?' })); }
  } catch (e) { setBtnLoading(btn, false); alert(tf('alertConnFailTpl', { msg: e.message })); }
}

// ===== TAB TRANG CHỦ (hero shop.html) =====
async function loadHeroTab(){
  heroTabLoaded = true;
  try {
    const [slidesRes, settingsRes] = await Promise.all([
      apiGet('action=getHeroSlides'),
      apiGet('action=getShopSettings')
    ]);
    if (slidesRes.status === 'success') { heroSlides = slidesRes.data || []; renderHeroSlideGrid(); }
    if (settingsRes.status === 'success') { heroSettingsData = settingsRes.data || {}; fillHeroSettingsForm(); }
  } catch (e) {
    alert(tf('alertConnFailTpl', { msg: e.message }));
  }
}
function renderHeroSlideGrid(){
  const grid = document.getElementById('hero-slide-grid');
  grid.innerHTML = heroSlides.map(function(s){
    return '<div class="hero-slide-thumb"><img src="' + esc(s.imageUrl) + '">' +
      '<button class="del-btn" onclick="deleteHeroSlideAdmin(\'' + s.id + '\', this)">✕</button></div>';
  }).join('') + '<div class="hero-slide-add" onclick="document.getElementById(\'hero-file-input\').click()">＋</div>';
}
function fillHeroSettingsForm(){
  ['eyebrowVi','eyebrowJa','titleVi','titleJa','subVi','subJa','ctaTextVi','ctaTextJa'].forEach(function(k){
    document.getElementById('hs-' + k).value = heroSettingsData[k] || '';
  });
}
async function onHeroImageChosen(ev){
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if (!file) return;
  if (!looksLikeImageFile(file)) { alert(tr('errNotImage')); return; }
  const addTile = document.querySelector('.hero-slide-add');
  if (addTile) addTile.textContent = '⏳';
  try {
    const resized = await resizeImageFile(file, 1600, 0.82);
    const up = await apiPost({ action: 'uploadProductImage', data: { filename: 'hero.jpg', mimeType: resized.mimeType, base64Data: resized.base64 } });
    if (up.status === 'ok') {
      const add = await apiPost({ action: 'addHeroSlide', data: { imageUrl: up.url } });
      if (add.status === 'ok') heroSlides.push({ id: add.id, imageUrl: up.url });
      else alert(tf('alertSaveErrTpl', { msg: add.message || '?' }));
    } else {
      alert(tf('alertSaveErrTpl', { msg: up.message || '?' }));
    }
  } catch (e) {
    alert(tf('alertConnFailTpl', { msg: e.message }));
  }
  renderHeroSlideGrid();
}
async function deleteHeroSlideAdmin(id, btn){
  if (!confirm(tr('confirmDeleteHeroSlide'))) return;
  setBtnLoading(btn, true);
  try {
    const j = await apiPost({ action: 'deleteHeroSlide', data: { id: id } });
    if (j.status === 'ok') {
      heroSlides = heroSlides.filter(s => s.id !== id);
      renderHeroSlideGrid();
    } else { setBtnLoading(btn, false); alert(tf('alertSaveErrTpl', { msg: j.message || '?' })); }
  } catch (e) { setBtnLoading(btn, false); alert(tf('alertConnFailTpl', { msg: e.message })); }
}
async function saveHeroSettings(btn){
  const fields = {};
  ['eyebrowVi','eyebrowJa','titleVi','titleJa','subVi','subJa','ctaTextVi','ctaTextJa'].forEach(function(k){
    fields[k] = document.getElementById('hs-' + k).value.trim();
  });
  setBtnLoading(btn, true);
  try {
    const j = await apiPost({ action: 'updateShopSettings', data: { fields: fields } });
    setBtnLoading(btn, false);
    if (j.status === 'ok') { Object.assign(heroSettingsData, fields); flashButton(btn, tr('savedFlash')); }
    else alert(tf('alertSaveErrTpl', { msg: j.message || '?' }));
  } catch (e) { setBtnLoading(btn, false); alert(tf('alertConnFailTpl', { msg: e.message })); }
}
